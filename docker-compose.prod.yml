# Production compose file — deployed on the VPS at $VPS_PATH, driven by
# .github/workflows/deploy.yml (docker compose -f docker-compose.prod.yml
# pull / up -d / ps).
#
# This project owns its own postgres service and named volume — verified
# on the VPS (2026-07-26) that no avtobirzhasi database already existed;
# the only running Postgres there (container uibirzhasi_db) belongs to a
# different, unrelated project and must never be touched or reused.
#
# Never run `docker compose down -v` against this file (see
# backend/docker-compose.yml for the story of why an implicit/careless
# compose project already destroyed one running container once on this
# exact machine's sibling projects).
#
# backend/frontend bind to 127.0.0.1 only — Caddy (running separately on
# the VPS, not in this file) terminates TLS and reverse-proxies to them.
# postgres also binds only to 127.0.0.1, and only so a human can `psql`
# into it directly from the VPS shell — the backend container reaches it
# over the compose-internal network by service name ("postgres"), not
# through that published port.
name: avtobirzhasi

services:
  postgres:
    image: postgres:17-alpine
    container_name: avtobirzhasi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - avtobirzhasi_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${DOCKERHUB_USERNAME}/avtobirzhasi-backend:latest
    container_name: avtobirzhasi_backend
    restart: unless-stopped
    environment:
      # Reaches postgres by compose service name, not host.docker.internal —
      # both containers are on the same compose-managed network.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    env_file:
      - ./backend.env
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /api/health itself checks DB connectivity (see
      # backend/internal/handlers/health.go) and returns 503 if the
      # database is unreachable, so this genuinely verifies the backend
      # can serve real requests — not just that the process is running.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: ${DOCKERHUB_USERNAME}/avtobirzhasi-frontend:latest
    container_name: avtobirzhasi_frontend
    restart: unless-stopped
    env_file:
      - ./frontend.env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  avtobirzhasi_pgdata:
