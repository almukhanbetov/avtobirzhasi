name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: every job only needs to read the repo (checkout).
# No job here needs to write issues/PRs/packages, so nothing broader is
# granted. Individual jobs don't escalate this.
permissions:
  contents: read

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/avtobirzhasi-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/avtobirzhasi-frontend

jobs:
  # ---------------------------------------------------------------------
  # Quality gates — run on every push AND every PR against main. Nothing
  # past this point (Docker build verification, the real image push, the
  # production deploy) is allowed to run unless both of these succeed.
  # ---------------------------------------------------------------------

  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      # Ephemeral, CI-only Postgres — destroyed with the runner at the end
      # of the job. Never the production database; ordinary throwaway
      # credentials are fine here (see Stage 7 report's Secrets section).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: avtobirzhsi_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/avtobirzhsi_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install goose (matches the version pinned in backend/Dockerfile)
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.27.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Apply migrations to the CI test database
        run: goose -dir migrations postgres "$TEST_DATABASE_URL" up

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # Stage 6 established that these integration tests share one test
      # database (self-match, price-bypass, deposit-pay fixtures) and must
      # not run as separate concurrent packages — see
      # STAGE6_AUTOMATED_TESTING_REPORT.md. `-p 1` is required, not
      # optional: the bare parallel `go test ./...` produced a real
      # Postgres deadlock (SQLSTATE 40P01) and cross-package fixture
      # clobbering when this was verified locally.
      - name: go test (sequential packages — shared test DB)
        run: go test -p 1 ./...

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Real script names from frontend/package.json — Stage 6 added
      # `test` (Vitest) and `lint` (ESLint); `build` and `tsc` predate it.
      - name: Unit tests (Vitest)
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  # ---------------------------------------------------------------------
  # Docker build verification — proves the real production images still
  # build after the code changes that just passed the gates above.
  # Neither image is pushed anywhere; this job needs no registry
  # credentials at all.
  # ---------------------------------------------------------------------
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (verification only — not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: avtobirzhasi-backend:ci-verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (verification only — not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: avtobirzhasi-frontend:ci-verify
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.avtobirzhasi.kz/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------
  # Everything below only ever runs for a push to main, never for a PR —
  # each job's own `if` enforces that independently of `needs`, since a
  # skipped required job would already skip its dependents by default.
  # ---------------------------------------------------------------------

  build-and-push:
    name: Build & Push Images
    needs: [backend-quality, frontend-quality, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: avtobirzhasi-production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.avtobirzhasi.kz/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: avtobirzhasi-production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stage 8D: "Deploy over SSH" below only ever pulls/runs Docker
      # IMAGES — it has no way to pick up changes to files that live in
      # the repo but not inside an image (docker-compose.prod.yml itself,
      # the backup scripts). Without this step, Stage 8's compose
      # healthchecks and backup scripts would never reach the VPS no
      # matter how many times this workflow ran — confirmed as a real,
      # live gap during Stage 8C's VPS verification (scripts/backup-db.sh
      # was found completely absent on the server). scp, not `git pull`:
      # $VPS_PATH is not assumed to be a git checkout, and this syncs
      # exactly the 3 files that matter, nothing else (no .env, no
      # secrets, no source code).
      - name: Sync infrastructure files to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # A comma-separated single line, not a YAML multi-line block:
          # this action's underlying tool (drone-scp) parses `source` as
          # a urfave/cli StringSlice sourced from an env var, which splits
          # on "," by default — NOT on newlines. A newline-joined value
          # here is treated as one single (invalid) path/glob, matches no
          # file at all, and drone-scp's `tar` refuses to create an empty
          # archive. Confirmed by reproducing the exact failure with the
          # real drone-scp v1.8.0 binary locally before fixing this line.
          source: "docker-compose.prod.yml,scripts/backup-db.sh,scripts/restore-db.sh"
          target: ${{ secrets.VPS_PATH }}
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.VPS_PATH }}"

            chmod +x scripts/backup-db.sh scripts/restore-db.sh

            docker compose -f docker-compose.prod.yml pull
            # Migrations run once, from the freshly-pulled backend image,
            # before the new backend container is started — `set -e`
            # above means a migration failure stops this script here and
            # the job is reported as failed, so `up -d` (and therefore
            # the actual cutover to new containers) never runs. Goose
            # migrations up is idempotent, so re-running this on a
            # database already at the latest version is a safe no-op.
            docker compose -f docker-compose.prod.yml run --rm --entrypoint sh backend -c './goose -dir migrations postgres "$DATABASE_URL" up'
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps

            # --- Stage 8D: daily backup schedule ---
            # Installed/refreshed on every deploy via the current user's
            # crontab (not a systemd timer — this VPS user's sudo/systemd
            # privileges are unknown from CI, and per-user crontab needs
            # none, matching the same non-root user docker compose already
            # runs as). Idempotent: only the single line carrying this
            # exact marker comment is ever removed before being re-added,
            # so re-deploying never duplicates it and no unrelated cron
            # entry this VPS user already has is ever touched.
            BACKUP_CRON_MARKER="avtobirzhasi-backup (managed by .github/workflows/deploy.yml)"
            BACKUP_CRON_LINE="0 3 * * * cd ${{ secrets.VPS_PATH }} && PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin BACKUP_DIR=${{ secrets.VPS_PATH }}/backups RETENTION_DAYS=14 ./scripts/backup-db.sh >> ${{ secrets.VPS_PATH }}/backups/backup.log 2>&1 # $BACKUP_CRON_MARKER"
            ( crontab -l 2>/dev/null | grep -vF "$BACKUP_CRON_MARKER" ; echo "$BACKUP_CRON_LINE" ) | crontab -
            crontab -l | grep -qF "$BACKUP_CRON_MARKER"

            # --- Stage 8D: prove the backup mechanism actually works on
            # THIS deploy, not just that it was installed for later ---
            mkdir -p backups
            BACKUP_DIR=./backups RETENTION_DAYS=14 ./scripts/backup-db.sh
            LATEST_BACKUP=$(ls -t ./backups/avtobirzhasi_*.sql.gz 2>/dev/null | head -1)
            if [ -z "$LATEST_BACKUP" ] || [ ! -s "$LATEST_BACKUP" ]; then
              echo "ERROR: no non-empty backup file found after backup-db.sh ran" >&2
              exit 1
            fi
            echo "Backup verified: $LATEST_BACKUP ($(du -h "$LATEST_BACKUP" | cut -f1))"
